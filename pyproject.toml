[project]
name = "agent-exporter"
version = "0.1.0"
description = "AI agent metrics for a Linux box, written as a Prometheus text file for Beszel"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = []

[project.scripts]
agent-exporter = "agent_exporter:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["agent_exporter.py"]
