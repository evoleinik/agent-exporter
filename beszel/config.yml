# Beszel agent config for agent-exporter. Needs Beszel with custom metrics (henrygd/beszel#2562).
# Put this in the agent's data directory as config.yml, or point CONFIG at it.
# Change each `path`: agent-exporter's --out file, then mem-pressure.sh's file. The Beszel agent's
# user must be able to read each file and every directory above it.
metrics:
  sources:
    - path: /home/YOU/.local/state/agent-exporter/agents.prom
      max_age: 2m
      display_names:
        agent_processes_claude: Claude Code
        agent_processes_codex: Codex
        agent_memory_bytes_claude: Claude Code
        agent_memory_bytes_codex: Codex
        agent_stale_memory_bytes: Held by stale sessions
        agent_sessions_working: Working
        agent_sessions_needs_you: Needs you
        agent_sessions_your_turn: Your turn
        agent_sessions_stale: Stale
        agent_needs_you_longest_seconds: Longest wait for you
        agent_runaway_processes: Runaway processes
        agent_runaway_longest_seconds: Longest runaway
        ollama_up: ollama up
        ollama_models_loaded: Loaded models
        ollama_memory_bytes: ollama memory
        ollama_vram_bytes: ollama VRAM
    - path: /home/YOU/.local/state/mem-pressure/mem.prom
      max_age: 1m
      display_names:
        memory_pressure_level: Memory pressure
